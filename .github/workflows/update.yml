name: Wind policy & industry monitor — collect and deploy

on:
  workflow_dispatch:
    inputs:
      crawl_scope:
        description: '采集范围：以31省为主，或包含海外全部来源'
        required: true
        default: 'provincial'
        type: choice
        options:
          - provincial
          - all
  schedule:
    # GitHub cron uses UTC; 00:13 UTC is 08:13 in Beijing.
    # Mon-Sat province-first run. Sunday is reserved for the full run below,
    # avoiding two expensive crawls only 14 minutes apart.
    - cron: '13 0 * * 1-6'
    # 00:27 UTC every Sunday: refresh domestic and preserved overseas sources.
    - cron: '27 0 * * 0'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'site/**'
      - 'adapters/**'
      - 'tests/**'
      - '*.py'
      - '*.json'
      - 'requirements.txt'

concurrency:
  group: wind-monitor-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-translation.txt

      - name: Cache translation models
        uses: actions/cache@v5
        with:
          path: ~/.local/share/argos-translate
          key: argos-v6-${{ runner.os }}-py311-en-vi-pt-it-ar-zh

      - name: Install dependencies
        run: |
          # Core crawling, parsing and publishing must not depend on GPU libraries.
          python -m pip install --disable-pip-version-check --retries 4 --timeout 45 -r requirements.txt
          python -c "import bs4, requests, playwright, pypdf; print('Core dependency imports OK')"

      - name: Run offline backend and frontend tests
        run: |
          python -m unittest discover -s tests -p 'test_policy_*.py' -v
          node tests/test_frontend_policy_v6.cjs
          node tests/test_frontend_news.cjs

      - name: Probe official source reachability from this GitHub runner
        continue-on-error: true
        run: |
          python policy_network_probe.py --region github-actions-ubuntu-latest --provinces-first --limit 32 --timeout 7 --output diagnostics/network_github_actions.json

      - name: Independently verify 31 provincial public listing pages and BJX
        continue-on-error: true
        run: |
          python policy_site_probe.py --province-first --workers 3 --output diagnostics/site_probe_github.json

      - name: Install Chromium for allowed public pages
        run: |
          # Browser downloads are also large; retry transient CDN failures.
          for attempt in 1 2 3; do
            if python -m playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 12; fi
          done
          echo "Chromium install failed after 3 attempts" >&2
          exit 1

      - name: Prepare each source's first-seen checkpoint
        run: python policy_scrape.py --prepare

      - name: Preserve new first-seen checkpoints before long crawl
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/policy_source_checkpoints.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record first-seen dates for configured policy sources'
            # A manual/user commit may land while this job is installing deps.
            # Rebase before push instead of failing the long crawl on non-fast-forward.
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Record this job's crawl start
        run: date -u +%Y-%m-%dT%H:%M:%SZ > diagnostics/this_job_started_utc.txt

      - name: Audit domestic policies already saved (before crawl)
        continue-on-error: true
        run: python policy_saved_results_audit.py --label before

      - name: Crawl province-first official policies and BJX media leads
        # Do not mask a process-level crash here. policy_scrape.py already records
        # individual source failures and continues the remaining sources itself.
        env:
          POLICY_BROWSER_FALLBACK: '1'
          POLICY_REQUEST_TIMEOUT: '18'
          POLICY_WORKERS: '4'
          POLICY_DOMESTIC_LOOKBACK_DAYS: '30'
          POLICY_DETAILS_PER_SOURCE: '32'
          POLICY_LIST_PAGES: '8'
          POLICY_PER_HOST_CONCURRENCY: '1'
          POLICY_PER_HOST_DELAY: '0.7'
        run: |
          if [ "${{ github.event.schedule }}" = "27 0 * * 0" ]; then
            python policy_scrape.py --mode auto --scope all
          else
            python policy_scrape.py --mode auto --scope "${{ inputs.crawl_scope || 'provincial' }}"
          fi

      - name: Verify crawl produced fresh state
        run: python policy_run_guard.py

      - name: Audit domestic policies saved (after crawl)
        if: always()
        continue-on-error: true
        run: python policy_saved_results_audit.py --label after

      - name: Publish backend crawl quality report
        if: always()
        continue-on-error: true
        run: |
          python policy_quality_summary.py
          python policy_source_recovery.py
          python policy_failure_diagnosis.py

      - name: Upload reachability and quality diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wind-policy-backend-diagnostics
          path: diagnostics/
          if-no-files-found: warn

      - name: Install optional CPU-only offline translation
        id: install_translation
        # Offline headline translation is optional. Never fail the policy crawl
        # because PyTorch/Argos packages or model hosts are temporarily unreachable.
        continue-on-error: true
        timeout-minutes: 8
        run: |
          # Install the official CPU wheel FIRST, so Argos/Stanza cannot pull in
          # the multi-GB CUDA/NVIDIA/Triton dependency chain from PyPI.
          python -m pip install --disable-pip-version-check --retries 2 --timeout 45 \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.13.0'
          python -m pip install --disable-pip-version-check --retries 2 --timeout 45 \
            -r requirements-translation.txt
          python -c "import torch; import argostranslate.package; import argostranslate.translate; assert torch.version.cuda is None, 'Expected CPU-only torch'; print('CPU-only Argos translation ready')"

      - name: Refresh industry news and weekly focus
        continue-on-error: true
        env:
          # Turn off translation when its optional installation failed.
          ENABLE_TRANSLATION: ${{ steps.install_translation.outcome == 'success' && '1' || '0' }}
          MAX_TRANSLATIONS_PER_RUN: '150'
          SOURCE_TIME_BUDGET_SECONDS: '70'
          REQUEST_TIMEOUT: '15'
          BROWSER_TIMEOUT_MS: '22000'
          WEEKLY_FOCUS_DAYS: '7'
          WEEKLY_FOCUS_COUNT: '8'
        run: |
          python scrape.py
          python strategic_filter.py
          python weekly_focus.py

      - name: Optional AI-assisted policy dimension & product design analysis
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          AI_MAX_ITEMS_PER_RUN: '12'
        run: python policy_ai_enrich.py

      - name: Build stable policy display data and CSV
        run: python build_site_data.py

      - name: Save monitoring results in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update wind regulatory and industry monitoring data'
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload website for Pages deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
